services:
  - type: web
    name: apexcare-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENCRYPTION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: APP_TRUSTED_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

