version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: apexcare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hms_app_user
      POSTGRES_PASSWORD: ClinicalAdmin2026!
      POSTGRES_DB: hms_production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms_app_user -d hms_production"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apexcare_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
